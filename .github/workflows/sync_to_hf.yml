name: Sync and Keep Alive Hugging Face Hub

on:
  push:
    branches: [main]
  # Runs every hour to prevent the Space from sleeping
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-to-hub:
    # This only runs when you push code
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          git remote add hf https://Vijayshete04:$HF_TOKEN@huggingface.co/spaces/Vijayshete04/pcos-diagnostic-ai
          git push --force hf main

  keep-alive:
    # This runs on the schedule OR after a push
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space
        run: |
          curl -I -L -A "Mozilla/5.0" https://huggingface.co/spaces/Vijayshete04/pcos-diagnostic-ai